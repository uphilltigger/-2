<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飼料計算</title>
  <link rel="stylesheet" href="css.css">
  <script src="script.js"></script>
</head>
<body>
  <h1>飼料計算</h1>
  <p>
    <a href="https://uphilltigger.github.io/-2/explain.html" target="_blank">説明を見る↗（別タブで開きます）</a>
    <a href="https://docs.google.com/spreadsheets/d/1LN2EQv8AessbEblE8TzG3ahySjkHLjPn5mNGlOoUAyI/edit?usp=sharing" target="_blank">スプレッドシートを開く↗（別タブで開きます）</a>
  </p>
  <div>
    <label>ウマ：
      <select id="weight">
        <option value="500" class="senior">アップヒルティガー</option>
        <option value="540" selected>グランシエロ</option>
        <option value="470">ドラゴンケーニッヒ</option>
        <option value="500">キタノインパクト</option>
        <option value="540">テイエムシュンソク</option>
        <option value="470">ワイルドヒロイン</option>
        <option value="470">キタノブルー</option>
        <option value="500">フェンネル</option>
        <option value="520" class="senior">タイダルベイスン</option>
        <option value="540">ノガロ</option>
        <option value="540" class="nobeet">ダノンクライム</option>
        <option value="470">ピースオブエイト</option>
        <option value="500">ファーブルトン</option>
        <option value="500" class="senior">アドマイヤカーリン</option>
        <hr>
        <option value="400">汎用：400 kg</option>
        <option value="450">汎用：450 kg</option>
        <option value="500">汎用：500 kg</option>
        <option value="540">汎用：540 kg</option>
      </select>
    </label>
    <br><br>
    <label>運動強度：
      <select id="work">
        <option value="無">無</option>
        <option value="軽">軽</option>
        <option value="中">中</option>
        <option value="強" selected>強</option>
      </select>
    </label>
  </div>
  <hr>
  <div id="main-content">
    <button id="reset-btn">初期化する</button>
    <button id="save-btn">スプレッドシートに保存する</button>
    
    <div class="table-container">
      <table id="feed-table">
        <thead>
          <tr>
            <th rowspan="2">飼料名</th>
            <th rowspan="2">朝夕</th>
            <th rowspan="2">昼夜</th>
            <th rowspan="2">合計</th>
            <th colspan="2" class="past-text">前年同期</th>
          </tr>
          <tr>
            <th class="past-text">朝夕</th>
            <th class="past-text">昼夜</th>
          </tr>
        </thead>
        <tbody id="feed-body"></tbody>
        <tbody id="sum-body"></tbody>
      </table>
    </div>
    <hr>
    <div class="table-container" id="alert-messages"><span id="horse-attribute"></span></div>
    <div class="table-container" id="result-balance"></div>
    <div class="table-container" id="result"></div>
    <hr>
  </div>
  <p style="text-align: center;">
    <b>&copy;2025-2026 MIURA SOTA</b>
  </p>
</body>
</html>
