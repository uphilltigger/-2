<!DOCTYPE html>
<html lang="ja">

    <option value="軽" selected>軽</option>
    <option value="中">中</option>
    <option value="強">強</option>
  </select>
</div>
<div class="feed-tables">
  <table border="1">
    <thead>
      <tr>
        <th></th>
        <th>ビート</th>
        <th>麦</th>
        <th>キューブ</th>
        <th>大豆</th>

        <th>濃厚</th>
        <th>ふすま</th>
        <th>塩</th>
        <th>乾草</th>

    </thead>

  </table>
  <table id="commonFeedTable"></table>
</div>

<table border="1">
  <thead>
    <tr>
      <th></th>
      <th>エネルギー</th>

</table>
